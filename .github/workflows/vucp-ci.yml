name: VUCP CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: CLI version
        run: python cli/vucp_cli_mvp.py --version
      - name: Lint standard template
        run: python cli/vucp_cli_mvp.py lint templates/standard --json
      - name: Lint web-dev template
        run: python cli/vucp_cli_mvp.py lint templates/web-dev --json
      - name: Doctor standard template
        run: python cli/vucp_cli_mvp.py doctor templates/standard --json
      - name: Export adapters smoke test
        run: python cli/vucp_cli_mvp.py export claude-md templates/standard --json
      - name: Packaging smoke test (install + vucp --help)
        run: |
          python -m venv /tmp/vucp-venv
          /tmp/vucp-venv/bin/pip install .
          /tmp/vucp-venv/bin/vucp --help
          /tmp/vucp-venv/bin/vucp --version
          /tmp/vucp-venv/bin/vucp init /tmp/smoke-lite --lite
          /tmp/vucp-venv/bin/vucp doctor /tmp/smoke-lite
          /tmp/vucp-venv/bin/vucp init /tmp/smoke-full
          /tmp/vucp-venv/bin/vucp doctor /tmp/smoke-full
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests
